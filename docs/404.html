<style>/* listen.22cs.xyz shared shell — one source for tokens, the layout container, header, hero heading, breadcrumb and footer.

:root{
  --brand:#FF7A7A;--accent:#B4404B;--bg:#FFF9F2;--surface:#FFFFFF;--surface-2:#F8F2EC;--ink:#24252B;--muted:#68666E;--line:#E6E0DC;

  --maxw:1200px;--pad:24px;--padL:max(var(--pad),env(safe-area-inset-left,0px));--padR:max(var(--pad),env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --yellow:#D3AB4A;--mint:#397B70;--lilac:#65558B;--tag-y:#111216;--tag-m:#FFFFFF;--tag-l:#FFFFFF;
  --tint:rgba(255,122,122,.14);--shadow:none;--shadow-hi:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111216;--surface:#1D1E24;--surface-2:#27282F;--ink:#F6F3EF;--muted:#B7B5BE;--line:#3B3C46;--accent:#FF7A7A;
  --yellow:#D3AB4A;--mint:#397B70;--lilac:#65558B;--tag-y:#111216;--tag-m:#FFFFFF;--tag-l:#FFFFFF;
  --tint:rgba(255,122,122,.14);--shadow:none;--shadow-hi:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
@media (max-width:720px){:root{--pad:16px}}

*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}

/* the one layout container: 1200px content box, 24px gutters (16px on phones) */
.in{width:100%;max-width:calc(var(--maxw) + var(--padL) + var(--padR));margin:0 auto;padding-left:var(--padL);padding-right:var(--padR)}

/* header: a floating pill bar whose outer edges sit on the container edges (V11) */
.top{padding-top:14px}

.top .in{position:relative}

.xbtn{display:none;align-items:center;gap:5px;height:38px;padding:0 13px 0 15px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--ink);font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap}

.xmenu{position:absolute;z-index:40;right:var(--padR);top:calc(100% + 8px);width:min(260px,calc(100vw - 32px));padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 44px rgba(30,15,20,.16)}

/* ---- status badges (data-driven: 最新 / 第 n 波) ---- */

/* ---- list-page series switcher pill (opens the same SeriesIndex as the home 「瀏覽全部」 rows) ---- */
.swpill{display:inline-flex;align-items:center;gap:12px;min-height:40px;padding:0 13px 0 17px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow);transition:background-color .18s,border-color .18s}

.swpill[aria-expanded="true"] svg{transform:rotate(180deg)}

.sxi{position:absolute;z-index:90;width:min(400px,calc(100vw - 32px));max-height:min(560px,calc(100dvh - 24px));display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(30,15,20,.2);overflow:hidden;animation:sxi-in .16s ease-out;outline:none}
:root[data-theme="dark"] .sxi{box-shadow:0 24px 60px rgba(0,0,0,.55)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sxi{box-shadow:0 24px 60px rgba(0,0,0,.55)}}
.sxi[hidden],.sxi-scrim[hidden]{display:none}

:root[data-theme="dark"] .sxi-list a:hover,:root[data-theme="dark"] .sxi-list a:focus-visible,:root[data-theme="dark"] .sxi-list a.on{background:color-mix(in srgb,#FF7A7A 22%,var(--surface))}

/* home (V11) */
:root{--lab-award:#FFD766;--lab-fest:#E8D3FF;--lab-chart:#BFEADB;--lab-ink:#24252B}
