<style>/* listen.22cs.xyz shared shell — one source for tokens, the layout container, header, hero heading, breadcrumb and footer.
   Inlined by listen-22cs/build_hub.py (home, 404) and grammy-69/scripts/build.py (every list page). Visual handoff V10. */
:root{
  --brand:#FF7A7A;--accent:#B4404B;--bg:#FFF9F2;--surface:#FFFFFF;--surface-2:#F8F2EC;--ink:#24252B;--muted:#6B6870;--line:#E6E0DD;
  --yellow:#FFD766;--mint:#BFEADB;--lilac:#E8E2F8;--tag-y:#24252B;--tag-m:#24252B;--tag-l:#24252B;
  --tint:rgba(255,122,122,.13);--on-brand:#1B1B1F;--shadow:0 6px 22px rgba(60,40,30,.05);--shadow-hi:0 10px 30px rgba(60,40,30,.09);
  --f:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --maxw:1200px;--pad:24px;--padL:max(var(--pad),env(safe-area-inset-left,0px));--padR:max(var(--pad),env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111216;--surface:#1C1D22;--surface-2:#26272D;--ink:#F6F3EF;--muted:#B7B5BE;--line:#3C3D44;--accent:#FF7A7A;
  --yellow:#D3AB4A;--mint:#397B70;--lilac:#65558B;--tag-y:#111216;--tag-m:#FFFFFF;--tag-l:#FFFFFF;
  --tint:rgba(255,122,122,.14);--shadow:none;--shadow-hi:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111216;--surface:#1C1D22;--surface-2:#26272D;--ink:#F6F3EF;--muted:#B7B5BE;--line:#3C3D44;--accent:#FF7A7A;
  --yellow:#D3AB4A;--mint:#397B70;--lilac:#65558B;--tag-y:#111216;--tag-m:#FFFFFF;--tag-l:#FFFFFF;
  --tint:rgba(255,122,122,.14);--shadow:none;--shadow-hi:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
@media (max-width:720px){:root{--pad:16px}}

*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* the one layout container: 1200px content box, 24px gutters (16px on phones) */
.in{width:100%;max-width:calc(var(--maxw) + var(--padL) + var(--padR));margin:0 auto;padding-left:var(--padL);padding-right:var(--padR)}

/* header: a floating rounded bar whose outer edges sit on the container edges */
.top{padding-top:16px}
.top .bar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 14px 10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.brandmark{display:flex;align-items:center;gap:11px;min-width:0;text-decoration:none;color:var(--ink)}
.top .brandmark{flex-shrink:0}
.brandmark .ico{width:44px;height:44px;flex:0 0 44px;display:block}
.bm-t{display:flex;flex-direction:column;min-width:0}
.bm-t b{font-size:24px;font-weight:900;line-height:1.13;letter-spacing:-.03em;white-space:nowrap}
.bm-by{margin-top:5px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;line-height:1}
.bm-by img{width:48px;height:auto;display:block}
.toplinks{display:flex;align-items:center;gap:14px;min-width:0;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.toplinks a{text-decoration:none}.toplinks a:hover,.toplinks [aria-current]{color:var(--ink)}
.edsw{min-width:0;display:flex}
.edsw select{max-width:min(46vw,280px);height:36px;text-overflow:ellipsis;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:0 12px;font:inherit;font-size:12.5px;font-weight:650}
.themebtn{display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surface-2);color:var(--ink);cursor:pointer;flex-shrink:0}
.themebtn:hover{border-color:var(--brand)}
.themebtn svg{width:19px;height:19px;display:block}
.themebtn .sun{display:none}
:root[data-theme="dark"] .themebtn .sun{display:block}:root[data-theme="dark"] .themebtn .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .themebtn .sun{display:block}:root:not([data-theme="light"]) .themebtn .moon{display:none}}

/* hero: breadcrumb + H1 start on the container edge on every page */
.hero .in{padding-top:44px;padding-bottom:0}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;font-weight:650;margin:0 0 26px}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--ink)}
.crumb .sl{opacity:.5}
.hero h1{margin:0;font-weight:900;letter-spacing:-.03em;text-wrap:balance}
.hero h1 .hn{position:relative;z-index:0;white-space:nowrap}
.hero h1 .hn::after{content:"";position:absolute;left:-.04em;right:-.04em;bottom:-.02em;height:.2em;border-radius:999px;background:var(--brand);opacity:.85;z-index:-1}
.rays{display:inline-block;color:var(--brand);flex-shrink:0}

/* footer */
footer{margin-top:64px;border-top:1px solid var(--line);background:var(--surface)}
footer .in{padding-top:28px;padding-bottom:48px;font-size:13px;color:var(--muted);display:grid;gap:8px}
footer a{color:var(--accent)}
.mk-site{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.mk-site img{display:block;width:96px;height:auto}
.mk-site p{margin:0;font-size:14px;color:var(--muted)}
.cta{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:999px;background:var(--brand);color:var(--on-brand)!important;text-decoration:none;font-size:13px;font-weight:750;white-space:nowrap}
.cta:hover{filter:brightness(.96)}

@media (max-width:720px){
  .top{padding-top:10px}
  .top .bar{min-height:60px;gap:10px;padding:8px 8px 8px 12px;border-radius:16px}
  .brandmark{gap:9px}
  .brandmark .ico{width:38px;height:38px;flex-basis:38px}
  .bm-t b{font-size:21px}
  .bm-by{margin-top:4px;font-size:10px}.bm-by img{width:42px}
  .toplinks{gap:8px}
  .edsw select{max-width:calc(100vw - 236px);height:40px}
  .themebtn{width:42px;height:42px}
  .hero .in{padding-top:28px}
  .crumb{margin-bottom:20px}
  .mk-site{grid-template-columns:auto minmax(0,1fr)}.mk-site .cta{grid-column:1/-1;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* home */
:root{--dot2:#A993E6;--ban-y:color-mix(in srgb,var(--yellow) 42%,var(--surface));--ban-m:color-mix(in srgb,var(--mint) 55%,var(--surface));--ban-l:color-mix(in srgb,var(--lilac) 75%,var(--surface))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dot2:#9C8BD6;--ban-y:color-mix(in srgb,var(--yellow) 15%,var(--surface));--ban-m:color-mix(in srgb,var(--mint) 30%,var(--surface));--ban-l:color-mix(in srgb,var(--lilac) 34%,var(--surface))}}
:root[data-theme="dark"]{--dot2:#9C8BD6;--ban-y:color-mix(in srgb,var(--yellow) 15%,var(--surface));--ban-m:color-mix(in srgb,var(--mint) 30%,var(--surface));--ban-l:color-mix(in srgb,var(--lilac) 34%,var(--surface))}
.eyebrow{color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
.hero h1{max-width:980px;font-size:clamp(36px,3.8vw,48px);line-height:1.22}
.hero h1 .rays{width:.56em;height:.56em;margin-left:.1em;vertical-align:.72em}
.lede{margin:16px 0 0;max-width:760px;color:var(--muted);font-size:16px;text-wrap:pretty}
.award{margin-top:52px;scroll-margin-top:16px}
.award:first-child{margin-top:40px}
.ah{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:16px}
.tag{display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:999px;font-size:13.5px;font-weight:850;letter-spacing:.06em;white-space:nowrap}
.t-award{background:var(--yellow);color:var(--tag-y)}.t-chart{background:var(--mint);color:var(--tag-m)}.t-fest{background:var(--lilac);color:var(--tag-l)}
.ah .rays{width:17px;height:17px;margin:0 2px 0 -7px;align-self:flex-start}
.ah h2{margin:0;font-size:24px;font-weight:900;line-height:1.3;letter-spacing:-.02em}
.ah .en{margin:0;color:var(--muted);font-size:13px;font-weight:600}
.eds{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.ed{min-width:0}
.ed a{display:flex;flex-direction:column;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
.ed a:hover{border-color:var(--brand);box-shadow:var(--shadow-hi);transform:translateY(-2px)}
.ban{position:relative;display:flex;align-items:flex-end;gap:10px;height:106px;padding:0 18px 12px;background:var(--ban-y)}
.t-chart-c .ban{background:var(--ban-m)}.t-fest-c .ban{background:var(--ban-l)}
.ban img{display:block;width:82px;height:82px;flex:0 0 82px;object-fit:cover;border-radius:10px;background:var(--surface-2);box-shadow:0 4px 12px rgba(30,20,10,.16)}
.ban .rays{position:absolute;top:14px;right:16px;width:26px;height:26px}
.eb{display:flex;flex-direction:column;gap:8px;flex:1;padding:14px 18px 16px}
.eh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eh h3{margin:0;font-size:22px;font-weight:900;line-height:1.25;letter-spacing:-.02em}
.eh .meta{margin:3px 0 0;font-size:12.5px;line-height:1.4;color:var(--muted)}
.eh .meta b{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
.arr{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:50%;background:var(--tint);color:var(--accent);transition:background .15s,color .15s}
.arr svg{width:17px;height:17px}
.ed a:hover .arr{background:var(--brand);color:var(--on-brand)}
.note{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.pv{list-style:none;margin:auto 0 0;padding:10px 0 0;border-top:1px solid var(--line);display:grid;gap:4px}
.pv li{display:flex;align-items:baseline;gap:7px;min-width:0;font-size:13px;line-height:1.45;white-space:nowrap}
.pv li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--brand);transform:translateY(-1px)}
.pv li:nth-child(2)::before{background:var(--dot2)}.pv li:nth-child(3)::before{background:var(--muted);opacity:.6}
.pv b{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;font-weight:750}
.pv span{min-width:0;flex:0 100 auto;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
@media (max-width:1099px){.eds{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}
@media (max-width:720px){.hero h1{font-size:clamp(28px,8vw,34px)}.lede{font-size:14.5px}.award{margin-top:40px}.award:first-child{margin-top:30px}
.ah h2{font-size:21px}.eds{grid-template-columns:minmax(0,1fr);gap:14px}.ban{height:98px;padding:0 16px 12px}.ban img{width:74px;height:74px;flex-basis:74px}.eb{padding:12px 16px 14px}.eh h3{font-size:21px}}
</style>

<script>(function(){var r=document.documentElement,mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function eff(){return r.dataset.theme||(mq&&mq.matches?'dark':'light')}
function sync(){document.querySelectorAll('.themebtn').forEach(function(b){var d=eff()==='dark';var l=d?'切換為淺色主題':'切換為深色主題';b.setAttribute('aria-label',l);b.title=l})}
