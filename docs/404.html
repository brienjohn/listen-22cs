<script>(function(){var r=document.documentElement,mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function eff(){return r.dataset.theme||(mq&&mq.matches?'dark':'light')}
function sync(){document.querySelectorAll('.themebtn').forEach(function(b){var d=eff()==='dark';var l=d?'切換為淺色主題':'切換為深色主題';b.setAttribute('aria-label',l);b.title=l})}
document.querySelectorAll('.themebtn').forEach(function(b){b.addEventListener('click',function(){var n=eff()==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('l22-theme',n)}catch(e){}sync()})});
if(mq&&mq.addEventListener)mq.addEventListener('change',sync);sync();
var top=document.querySelector('.top.sticky'),h1=document.querySelector('.home-hero h1');
if(top&&h1&&'IntersectionObserver'in window){new IntersectionObserver(function(es){top.classList.toggle('scrolled',!es[0].isIntersecting)},{rootMargin:'-80px 0px 0px 0px'}).observe(h1)}
function fit(){var W=innerWidth,MAX=W<=620?3:W<=1099?4:5,ROT=[5,-4,3,-6,2],OP=[1,.9,.82,.76,.72];
document.querySelectorAll('.cvs').forEach(function(c){var a=c.parentNode,n=a.querySelector('.nm');if(!n||!a.offsetParent)return;var im=[].slice.call(c.querySelectorAll('img'));c.classList.remove('off');
if(im.length<2){c.classList.add('off');return}var nr=n.getBoundingClientRect().right,tries=[];for(var k=Math.min(MAX,im.length);k>=2;k--)tries.push([k,32]);tries.push([2,28]);
function set(k,s){var st=Math.round(s*.5);im.forEach(function(m,i){if(i>=k){m.style.display='none';return}var f=k-1-i;m.style.display='block';m.style.width=m.style.height=s+'px';m.style.marginTop=(-s/2)+'px';m.style.right=(f*st)+'px';m.style.transform='rotate('+ROT[f]+'deg)';m.style.opacity=OP[f]})}
for(var t=0;t<tries.length;t++){set(tries[t][0],tries[t][1]);var l=1e9;im.forEach(function(m){if(m.style.display!=='none')l=Math.min(l,m.getBoundingClientRect().left)});if(nr+6<=l)return}c.classList.add('off')})}
document.querySelectorAll('.cvs img').forEach(function(m){m.addEventListener('error',function(){m.remove();fit()})});
document.querySelectorAll('.more').forEach(function(b){b.addEventListener('click',function(){var c=b.closest('.series'),o=c.classList.toggle('open');b.setAttribute('aria-expanded',o);b.textContent=o?'收合':b.dataset.label;fit()})});
fit();addEventListener('resize',fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit)})();</script>
</body>
